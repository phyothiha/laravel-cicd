version: 0.0
os: linux

files:
    - source: /
      destination: /var/www/laravel

file_exists_behavior: OVERWRITE

hooks:
    AfterInstall:
        - location: scripts/after_install.sh
          timeout: 300
          runas: root

    ValidateService:
        - location: scripts/validate_service.sh
          timeout: 120
          runas: root
